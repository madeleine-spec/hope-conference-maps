<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
  >

  <title>HOPE Conference Map</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: Helvetica, Arial, sans-serif;
    }

    .map-page {
      width: 100%;
      padding: 15px;
    }

    .map-header {
      text-align: center;
      margin-bottom: 15px;
    }

    .map-header h1 {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 700;
      color: #111111;
    }

    .map-header p {
      margin: 0;
      font-size: 14px;
      color: #666666;
    }

    .map-container {
      width: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .map-container img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .zoom-note {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #777777;
    }

  </style>

</head>


<body>

  <main class="map-page">

    <div class="map-header">

      <h1>Conference Map</h1>

      <p>HOPE Conference 2026</p>

    </div>


    <div class="map-container">

      <img
        src="conference-map.png"
        alt="HOPE Conference 2026 Conference Map"
      >

    </div>


    <div class="zoom-note">
      Pinch to zoom for a closer look.
    </div>

  </main>

</body>

</html>
